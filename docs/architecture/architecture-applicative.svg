<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f855a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937} .title{font-size:30px;font-weight:700;fill:#17365d}.subtitle{font-size:15px;fill:#475569}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6}.box{stroke-width:2.2;rx:16}.label{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)} .edge2{fill:none;stroke:#2f855a;stroke-width:3;marker-end:url(#greenArrow)}</style><rect width="100%" height="100%" fill="#ffffff"/><text class="title" x="800" y="42" text-anchor="middle">ISI-Eco Report · Architecture applicative</text><text class="subtitle" x="800" y="70" text-anchor="middle">Architecture client-serveur à deux applications clientes et un backend modulaire</text><rect class="group" x="45" y="95" width="1510" height="115" rx="22"/><text x="800" y="122" text-anchor="middle" font-size="20" font-weight="700">Utilisateurs</text><rect class="box" x="115" y="140" width="320" height="52" rx="16" fill="#ffffff" stroke="#8395a7"/><text x="275" y="169" text-anchor="middle" font-size="18" font-weight="700">Citoyens</text><rect class="box" x="635" y="140" width="320" height="52" rx="16" fill="#ffffff" stroke="#8395a7"/><text x="795" y="169" text-anchor="middle" font-size="18" font-weight="700">Agents de terrain</text><rect class="box" x="1155" y="140" width="320" height="52" rx="16" fill="#ffffff" stroke="#8395a7"/><text x="1315" y="169" text-anchor="middle" font-size="18" font-weight="700">Administrateurs et responsables</text><rect x="45" y="250" width="1510" height="205" rx="22" fill="#f7fbff" stroke="#8eadd0" stroke-width="2"/><text x="800" y="278" text-anchor="middle" font-size="20" font-weight="700">Applications clientes</text><rect class="box" x="180" y="300" width="540" height="128" rx="16" fill="#dceaf7" stroke="#4d78a8"/><text x="450" y="329" text-anchor="middle" font-size="21" font-weight="700">APPLICATION MOBILE</text><text x="450" y="356" text-anchor="middle" font-size="16">Parcours citoyen : dépôt, photos, géolocalisation, suivi</text><text x="450" y="380" text-anchor="middle" font-size="16">Parcours agent : missions affectées, compte rendu et preuves</text><rect class="box" x="880" y="300" width="540" height="128" rx="16" fill="#dceaf7" stroke="#4d78a8"/><text x="1150" y="329" text-anchor="middle" font-size="21" font-weight="700">APPLICATION WEB D’ADMINISTRATION</text><text x="1150" y="356" text-anchor="middle" font-size="16">Comptes, rôles et référentiels</text><text x="1150" y="380" text-anchor="middle" font-size="16">Qualification, dossiers, affectations, interventions et indicateurs</text><path d="M275,192 L450,300" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M795,192 L450,300" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M1315,192 L1150,300" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text class="small" x="800" y="485" text-anchor="middle">HTTPS / JSON · les clients ne se connectent jamais directement à PostgreSQL</text><rect class="box" x="520" y="510" width="560" height="100" rx="16" fill="#dff2e7" stroke="#4b8b69"/><text x="800" y="539" text-anchor="middle" font-size="22" font-weight="700">API REST NestJS / HTTPS</text><text x="800" y="566" text-anchor="middle" font-size="16">Contrôleurs, DTO, validation, authentification et autorisations</text><path d="M450,428 L720,510" stroke="#2f855a" stroke-width="3"  fill="none" marker-end="url(#arrow)"/><path d="M1150,428 L880,510" stroke="#2f855a" stroke-width="3"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="520" y="650" width="560" height="90" rx="16" fill="#e7f3ec" stroke="#6a9e83"/><text x="800" y="679" text-anchor="middle" font-size="21" font-weight="700">Services applicatifs</text><text x="800" y="706" text-anchor="middle" font-size="16">Cas d’utilisation, règles métier et transactions</text><path d="M800,610 L800,650" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="55" y="790" width="320" height="105" rx="16" fill="#f4f7fa" stroke="#71869a"/><text x="215" y="819" text-anchor="middle" font-size="17" font-weight="700">Signalements</text><text x="215" y="846" text-anchor="middle" font-size="14">Création, suivi et qualification</text><path d="M800,740 L215,790" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="445" y="790" width="320" height="105" rx="16" fill="#f4f7fa" stroke="#71869a"/><text x="605" y="819" text-anchor="middle" font-size="17" font-weight="700">Dossiers / affectations</text><text x="605" y="846" text-anchor="middle" font-size="14">Catégories, équipes et décisions</text><path d="M800,740 L605,790" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="835" y="790" width="320" height="105" rx="16" fill="#f4f7fa" stroke="#71869a"/><text x="995" y="819" text-anchor="middle" font-size="17" font-weight="700">Interventions</text><text x="995" y="846" text-anchor="middle" font-size="14">Comptes rendus et vérifications</text><path d="M800,740 L995,790" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="1225" y="790" width="320" height="105" rx="16" fill="#f4f7fa" stroke="#71869a"/><text x="1385" y="819" text-anchor="middle" font-size="17" font-weight="700">Comptes / référentiels / audit</text><text x="1385" y="846" text-anchor="middle" font-size="14">Habilitations et traçabilité</text><path d="M800,740 L1385,790" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="520" y="945" width="560" height="85" rx="16" fill="#e8f1eb" stroke="#6a9e83"/><text x="800" y="974" text-anchor="middle" font-size="20" font-weight="700">Infrastructure et persistance</text><text x="800" y="1001" text-anchor="middle" font-size="15">Prisma, transactions, stockage des médias et migrations</text><path d="M215,895 L800,945" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M605,895 L800,945" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M995,895 L800,945" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M1385,895 L800,945" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="195" y="1060" width="520" height="70" rx="16" fill="#eee5f8" stroke="#8b70a7"/><text x="455" y="1089" text-anchor="middle" font-size="19" font-weight="700">PostgreSQL / Supabase</text><text x="455" y="1116" text-anchor="middle" font-size="14">Données métier et événements</text><rect class="box" x="885" y="1060" width="520" height="70" rx="16" fill="#eee5f8" stroke="#8b70a7"/><text x="1145" y="1089" text-anchor="middle" font-size="19" font-weight="700">Supabase Storage</text><text x="1145" y="1116" text-anchor="middle" font-size="14">Photos et pièces justificatives</text><path d="M680,1030 L455,1060" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M920,1030 L1145,1060" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text class="small" x="800" y="1150" text-anchor="middle">Une API et un backend communs ; les écrans et autorisations varient selon les rôles.</text></svg>