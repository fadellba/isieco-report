s et référentiels</text><text x="635" y="630" font-size="20" font-weight="700">Sorties</text><text x="635" y="675" font-size="18">• Référence et accusé de réception</text><text x="635" y="715" font-size="18">• Suivi et notifications applicatives</text><text x="635" y="755" font-size="18">• Missions et informations autorisées</text><text x="635" y="795" font-size="18">• Historique métier et indicateurs</text><rect class="box" x="35" y="155" width="360" height="86" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="215" y="184" text-anchor="middle" font-size="17" font-weight="700">Citoyen / déclarant</text><text x="215" y="211" text-anchor="middle" font-size="13">Observations, GPS, photos · Accusé, suivi et points</text><path d="M395,199 L575,199" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="35" y="290" width="360" height="86" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="215" y="319" text-anchor="middle" font-size="17" font-weight="700">Agent de qualification</text><text x="215" y="346" text-anchor="middle" font-size="13">Qualification, compléments · Acceptation / rejet</text><path d="M395,334 L575,334" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="35" y="425" width="360" height="86" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="215" y="454" text-anchor="middle" font-size="17" font-weight="700">Responsable de traitement</text><text x="215" y="481" text-anchor="middle" font-size="13">Dossiers, priorités · Consultation des indicateurs</text><path d="M395,469 L575,469" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="35" y="560" width="360" height="86" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="215" y="589" text-anchor="middle" font-size="17" font-weight="700">Responsable d’affectation</text><text x="215" y="616" text-anchor="middle" font-size="13">Affectation par catégorie · Équipes et compétences</text><path 