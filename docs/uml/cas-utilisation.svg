<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1120" viewBox="0 0 1750 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f855a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937} .title{font-size:30px;font-weight:700;fill:#17365d}.subtitle{font-size:15px;fill:#475569}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6}.box{stroke-width:2.2;rx:16}.label{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)} .edge2{fill:none;stroke:#2f855a;stroke-width:3;marker-end:url(#greenArrow)}</style><rect width="100%" height="100%" fill="#ffffff"/><text class="title" x="875" y="42" text-anchor="middle">ISI-Eco Report · Diagramme UML des cas d’utilisation</text><text class="subtitle" x="875" y="70" text-anchor="middle">Vue synthétique des huit rôles métier et des fonctions principales</text><rect x="510" y="105" width="1190" height="900" rx="22" fill="#fbfdff" stroke="#24466f" stroke-width="3"/><text x="1105" y="145" text-anchor="middle" font-size="23" font-weight="700" fill="#24466f">Système ISI-Eco Report</text><rect class="box" x="30" y="155" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="184" text-anchor="middle" font-size="17" font-weight="700">Citoyen</text><rect class="box" x="30" y="255" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="284" text-anchor="middle" font-size="17" font-weight="700">Agent qualification</text><rect class="box" x="30" y="355" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="384" text-anchor="middle" font-size="17" font-weight="700">Responsable traitement</text><rect class="box" x="30" y="455" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="484" text-anchor="middle" font-size="17" font-weight="700">Responsable affectation</text><rect class="box" x="30" y="555" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="584" text-anchor="middle" font-size="17" font-weight="700">Agent terrain</text><rect class="box" x="30" y="655" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="684" text-anchor="middle" font-size="17" font-weight="700">Vérificateur clôture</text><rect class="box" x="30" y="755" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="784" text-anchor="middle" font-size="17" font-weight="700">Gestionnaire référentiel</text><rect class="box" x="30" y="855" width="340" height="62" rx="16" fill="#edf4fb" stroke="#315a85"/><text x="200" y="884" text-anchor="middle" font-size="17" font-weight="700">Administrateur comptes</text><ellipse cx="750" cy="231" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="237" text-anchor="middle" font-size="15" font-weight="600">Créer un signalement</text><ellipse cx="1140" cy="231" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="237" text-anchor="middle" font-size="15" font-weight="600">Ajouter photos et position</text><ellipse cx="750" cy="311" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="317" text-anchor="middle" font-size="15" font-weight="600">Suivre ses signalements</text><ellipse cx="1140" cy="311" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="317" text-anchor="middle" font-size="15" font-weight="600">Répondre à un complément</text><ellipse cx="750" cy="411" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="417" text-anchor="middle" font-size="15" font-weight="600">Qualifier / décider</text><ellipse cx="1140" cy="411" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="417" text-anchor="middle" font-size="15" font-weight="600">Demander un complément</text><ellipse cx="750" cy="511" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="517" text-anchor="middle" font-size="15" font-weight="600">Créer / piloter un dossier</text><ellipse cx="1140" cy="511" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="517" text-anchor="middle" font-size="15" font-weight="600">Définir priorité / catégories</text><ellipse cx="750" cy="611" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="617" text-anchor="middle" font-size="15" font-weight="600">Affecter une catégorie à une équipe</text><ellipse cx="1140" cy="611" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="617" text-anchor="middle" font-size="15" font-weight="600">Répondre à une affectation</text><ellipse cx="750" cy="711" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="717" text-anchor="middle" font-size="15" font-weight="600">Réaliser une intervention</text><ellipse cx="1140" cy="711" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="717" text-anchor="middle" font-size="15" font-weight="600">Soumettre compte rendu et preuves</text><ellipse cx="750" cy="811" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="817" text-anchor="middle" font-size="15" font-weight="600">Vérifier la résolution</text><ellipse cx="1140" cy="811" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="817" text-anchor="middle" font-size="15" font-weight="600">Clôturer ou demander une reprise</text><ellipse cx="750" cy="911" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="750" y="917" text-anchor="middle" font-size="15" font-weight="600">Gérer les référentiels</text><ellipse cx="1140" cy="911" rx="170" ry="31" fill="#e8f2fb" stroke="#4d78a8" stroke-width="2"/><text x="1140" y="917" text-anchor="middle" font-size="15" font-weight="600">Gérer comptes et rôles</text><path d="M370,186 L450,186 L450,231 L580,231" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,186 L450,186 L450,231 L970,231" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,186 L450,186 L450,311 L580,311" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,186 L450,186 L450,311 L970,311" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,286 L450,286 L450,411 L580,411" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,286 L450,286 L450,411 L970,411" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,386 L450,386 L450,511 L580,511" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,386 L450,386 L450,511 L970,511" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,486 L450,486 L450,611 L580,611" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,486 L450,486 L450,611 L970,611" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,586 L450,586 L450,711 L580,711" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,586 L450,586 L450,711 L970,711" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,686 L450,686 L450,811 L580,811" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,686 L450,686 L450,811 L970,811" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,786 L450,786 L450,911 L580,911" stroke="#94a3b8" stroke-width="1.6" fill="none"/><path d="M370,886 L450,886 L450,911 L970,911" stroke="#94a3b8" stroke-width="1.6" fill="none"/><text x="1105" y="1065" text-anchor="middle" class="small">Les autorisations et les droits sur chaque ressource sont vérifiés par l’API, pas par le seul affichage client.</text></svg>