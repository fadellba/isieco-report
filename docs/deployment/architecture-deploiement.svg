"  fill="none" marker-end="url(#arrow)"/><path d="M1335,230 L1480,525" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect class="box" x="45" y="470" width="360" height="125" rx="16" fill="#eef2f7" stroke="#7c8998"/><text x="225" y="499" text-anchor="middle" font-size="21" font-weight="700">GitHub Free</text><text x="225" y="526" text-anchor="middle" font-size="16">Monorepo · branches · Pull Requests</text><text x="225" y="550" text-anchor="middle" font-size="16">Issues et versions</text><rect class="box" x="510" y="455" width="360" height="125" rx="16" fill="#eef2f7" stroke="#7c8998"/><text x="690" y="484" text-anchor="middle" font-size="21" font-weight="700">GitHub Actions · CI</text><text x="690" y="511" text-anchor="middle" font-size="16">Installation, Prisma, tests, typecheck</text><text x="690" y="535" text-anchor="middle" font-size="16">Build Web / API / Mobile</text><rect class="box" x="975" y="455" width="360" height="125" rx="16" fill="#eee8f7" stroke="#8b70a7"/><text x="1155" y="484" text-anchor="middle" font-size="21" font-weight="700">GitHub Releases</text><text x="1155" y="511" text-anchor="middle" font-size="16">APK Android signé</text><text x="1155" y="535" text-anchor="middle" font-size="16">SHA-256 et notes de version</text><path d="M405,530 L510,520" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M870,520 L975,520" stroke="#64748b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M1155,455 L700,240" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/><path d="M1155,455 L1155,280" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/><path d="M1155,520 L375,310" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/><rect x="45" y="700" width="1705" height="180" rx="18" fill="#fffaf0" stroke="#d6b56f" stroke-width="2"/><text x="75" y="742" font-size="21" font-weight="700">Distribution et limites de la cible MVP</text><text x="75" y="785" font-size="17">• L’APK Android signé est publié comme actif GitHub Release ; la page publique /telecharger fournit le lien.</text><text x="75" y="820" font-size="17">• Les fichiers persistants résident dans Supabase Storage, jamais sur le disque éphémère Render.</text><text x="75" y="855" font-size="17">• Plans gratuits : quotas et mise en veille possibles ; cette cible convient au MVP / démonstration, pas à une production critique.</text><text x="1500" y="935" text-anchor="end" font-size="14" fill="#64748b">* Vérifier l’éligibilité du projet au plan Vercel Hobby (usage personnel/non commercial).</text></svg>