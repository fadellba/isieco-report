services:
  postgres:
    image: postgres:18-alpine
    container_name: isieco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isieco_report
      POSTGRES_USER: isieco
      POSTGRES_PASSWORD: isieco_dev_password
    ports:
      - "5432:5432"
    volumes:
      - isieco_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isieco -d isieco_report"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  isieco_postgres_data:
