name: Staging Database and Storage Restore Drill

on:
  workflow_dispatch:
    inputs:
      run_restore_drill:
        description: "Select RUN to copy staging application data into isolated restore targets."
        required: true
        type: choice
        options: [NO, RUN]
        default: NO
      confirm_staging_data_copy:
        description: "Confirm that staging business data and private media will be copied temporarily to this isolated GitHub runner."
        required: true
        type: choice
        options: [NO, YES]
        default: NO

permissions:
  contents: read

concurrency:
  group: staging-database-storage-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    name: Back up and restore staging data in isolated targets
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.run_restore_drill == 'RUN' && github.event.inputs.confirm_staging_data_copy == 'YES'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    services:
      restore-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-only
          POSTGRES_DB: restore
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      STAGING_PRISMA_URL: ${{ secrets.STAGING_PRISMA_URL }}
      STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      STAGING_SUPABASE_CA_CERT: ${{ secrets.STAGING_SUPABASE_CA_CERT }}
      SUPABASE_URL: https://mlhbdautaxufubaybzyt.supabase.co
      SOURCE_BUCKET: isieco-private-media
      RESTORE_DATABASE_URL: postgresql://postgres:restore-only@127.0.0.1:55432/restore

    steps:
      - name: Validate source and restore targets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STAGING_PRISMA_URL:-}" || {
            echo "Missing staging environment secret: STAGING_PRISMA_URL"
            exit 1
          }
          test -n "${STAGING_SUPABASE_SECRET_KEY:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_SECRET_KEY"
            exit 1
          }
          test -n "${STAGING_SUPABASE_CA_CERT:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_CA_CERT"
            exit 1
          }
          node --input-type=module <<'NODE'
          const source = new URL(process.env.STAGING_PRISMA_URL);
          if (!['postgres:', 'postgresql:'].includes(source.protocol)
            || !source.hostname.endsWith('.pooler.supabase.com')
            || source.port !== '5432'
            || decodeURIComponent(source.username) !== 'postgres.mlhbdautaxufubaybzyt'
            || source.pathname !== '/postgres'
            || !['require', 'verify-ca', 'verify-full'].includes(source.searchParams.get('sslmode'))
            || !source.password) {
            throw new Error('Source database URL does not target the approved staging project.');
          }
          if (process.env.SUPABASE_URL !== 'https://mlhbdautaxufubaybzyt.supabase.co'
            || process.env.SOURCE_BUCKET !== 'isieco-private-media') {
            throw new Error('Source Storage project or bucket is not the approved staging target.');
          }
          const target = new URL(process.env.RESTORE_DATABASE_URL);
          if (target.protocol !== 'postgresql:'
            || target.hostname !== '127.0.0.1'
            || target.port !== '55432'
            || target.username !== 'postgres'
            || target.password !== 'restore-only'
            || target.pathname !== '/restore') {
            throw new Error('Restore database must be the isolated local PostgreSQL service.');
          }
          const key = process.env.STAGING_SUPABASE_SECRET_KEY;
          if (key.startsWith('sb_publishable_') || key.startsWith('sb_anon_')) {
            throw new Error('Storage restore requires a server-side staging key.');
          }
          const ca = process.env.STAGING_SUPABASE_CA_CERT;
          if (!ca.includes('-----BEGIN CERTIFICATE-----') || !ca.includes('-----END CERTIFICATE-----')) {
            throw new Error('STAGING_SUPABASE_CA_CERT must contain a PEM certificate.');
          }
          console.log('Staging source, CA certificate, and isolated local PostgreSQL restore target validated; secrets were not printed.');
          NODE

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Prepare strict libpq TLS connection to staging
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const source = new URL(process.env.STAGING_PRISMA_URL);
          const fields = {
            PGHOST: source.hostname,
            PGPORT: source.port,
            PGUSER: decodeURIComponent(source.username),
            PGDATABASE: decodeURIComponent(source.pathname.slice(1)),
            PGPASSWORD: decodeURIComponent(source.password),
            PGSSLMODE: 'verify-full',
            PGSSLROOTCERT: '/certs/supabase-ca.pem',
          };
          for (const [key, value] of Object.entries(fields)) {
            if (!value || /[\r\n]/u.test(value)) throw new Error('Invalid PostgreSQL connection field: ' + key);
          }
          process.stdout.write('::add-mask::' + fields.PGPASSWORD + '\n');
          appendFileSync(process.env.GITHUB_ENV, Object.entries(fields).map(([key, value]) => key + '=' + value).join('\n') + '\n');
          writeFileSync(process.env.RUNNER_TEMP + '/supabase-ca.pem', process.env.STAGING_SUPABASE_CA_CERT, { mode: 0o600 });
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: pnpm build:packages

      - name: Start recovery drill timer
        id: restore_timer
        shell: bash
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare table count verification
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/count-application-tables.sql" <<'SQL'
          CREATE TEMP TABLE restore_drill_counts (
            table_name text PRIMARY KEY,
            row_count bigint NOT NULL
          );
          DO $$
          DECLARE entry record;
          BEGIN
            FOR entry IN
              SELECT schemaname, tablename
              FROM pg_tables
              WHERE schemaname IN ('public', 'audit')
              ORDER BY schemaname, tablename
            LOOP
              EXECUTE format(
                'INSERT INTO restore_drill_counts (table_name, row_count) SELECT %L, count(*) FROM %I.%I',
                entry.schemaname || '.' || entry.tablename,
                entry.schemaname,
                entry.tablename
              );
            END LOOP;
          END
          $$;
          SELECT table_name || E'\t' || row_count::text
          FROM restore_drill_counts
          ORDER BY table_name;
          SQL
          test -s "$RUNNER_TEMP/count-application-tables.sql"

      - name: Back up staging application schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isieco-restore-drill"
          chmod 700 "$RUNNER_TEMP/isieco-restore-drill"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env PGHOST --env PGPORT --env PGUSER --env PGDATABASE --env PGPASSWORD \
            --env PGSSLMODE --env PGSSLROOTCERT --env GITHUB_RUN_ID \
            --volume "$RUNNER_TEMP/supabase-ca.pem:/certs/supabase-ca.pem:ro" \
            --volume "$RUNNER_TEMP/isieco-restore-drill:/backup" \
            postgres:17 sh -lc '
              set -eu
              pg_dump --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" \
                --schema=public --schema=audit \
                --no-owner --no-acl --format=plain \
                --file="/backup/staging-app-$GITHUB_RUN_ID.sql"
              test -s "/backup/staging-app-$GITHUB_RUN_ID.sql"
            '
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env PGHOST --env PGPORT --env PGUSER --env PGDATABASE --env PGPASSWORD \
            --env PGSSLMODE --env PGSSLROOTCERT \
            --volume "$RUNNER_TEMP/supabase-ca.pem:/certs/supabase-ca.pem:ro" \
            --volume "$RUNNER_TEMP/count-application-tables.sql:/count-application-tables.sql:ro" \
            --volume "$RUNNER_TEMP/isieco-restore-drill:/backup" \
            postgres:17 sh -lc '
              set -eu
              psql --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" \
                --quiet --tuples-only --no-align --set ON_ERROR_STOP=1 \
                --file=/count-application-tables.sql > "/backup/source-counts.txt"
              test -s "/backup/source-counts.txt"
              LC_ALL=C sort -o "/backup/source-counts.txt" "/backup/source-counts.txt"
            '
          sha256sum "$RUNNER_TEMP/isieco-restore-drill/staging-app-$GITHUB_RUN_ID.sql" \
            > "$RUNNER_TEMP/isieco-restore-drill/SHA256SUMS"
          sha256sum --check "$RUNNER_TEMP/isieco-restore-drill/SHA256SUMS"
          echo "Application database backup created and checksummed."

      - name: Restore database into isolated local PostgreSQL
        id: restore_database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host postgres:17 sh -lc '
            set -eu
            until pg_isready -h 127.0.0.1 -p 55432 -U postgres -d restore; do sleep 1; done
          '
          docker run --rm --network host \
            --env RESTORE_DATABASE_URL \
            postgres:17 sh -lc '
              set -eu
              psql "$RESTORE_DATABASE_URL" --set ON_ERROR_STOP=1 \
                --command "DROP SCHEMA IF EXISTS audit CASCADE; DROP SCHEMA IF EXISTS public CASCADE;"
            '
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env RESTORE_DATABASE_URL \
            --env GITHUB_RUN_ID \
            --volume "$RUNNER_TEMP/isieco-restore-drill:/backup:ro" \
            postgres:17 sh -lc '
              set -eu
              psql "$RESTORE_DATABASE_URL" --single-transaction \
                --set ON_ERROR_STOP=1 \
                --file="/backup/staging-app-$GITHUB_RUN_ID.sql"
            '
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env RESTORE_DATABASE_URL \
            --volume "$RUNNER_TEMP/count-application-tables.sql:/count-application-tables.sql:ro" \
            --volume "$RUNNER_TEMP/isieco-restore-drill:/backup" \
            postgres:17 sh -lc '
              set -eu
              psql "$RESTORE_DATABASE_URL" --quiet --tuples-only --no-align \
                --set ON_ERROR_STOP=1 --file=/count-application-tables.sql \
                > /backup/restored-counts.txt
              LC_ALL=C sort -o /backup/restored-counts.txt /backup/restored-counts.txt
              diff -u /backup/source-counts.txt /backup/restored-counts.txt
            '
          echo "DATABASE_RESTORE_DRILL=SUCCESS schemas=public,audit table_row_counts=match"

      - name: Back up and restore private Storage objects
        id: restore_storage
        run: node scripts/staging-storage-restore-drill.mjs

      - name: Clean up temporary local backup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/isieco-restore-drill" "$RUNNER_TEMP/isieco-storage-restore-$GITHUB_RUN_ID" "$RUNNER_TEMP/supabase-ca.pem"

      - name: Record recovery drill evidence
        if: always()
        shell: bash
        env:
          DATABASE_RESTORE_OUTCOME: ${{ steps.restore_database.outcome }}
          STORAGE_RESTORE_OUTCOME: ${{ steps.restore_storage.outcome }}
          RESTORE_STARTED_EPOCH: ${{ steps.restore_timer.outputs.started_epoch }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          if [[ -n "$RESTORE_STARTED_EPOCH" ]]; then
            elapsed="$((now - RESTORE_STARTED_EPOCH))"
          else
            elapsed="not started"
          fi
          {
            echo "## Staging recovery drill"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Database restore: `$DATABASE_RESTORE_OUTCOME`"
            echo "- Storage restore: `$STORAGE_RESTORE_OUTCOME`"
            echo "- Observed elapsed time (RTO proxy): `$elapsed seconds`"
            echo "- RPO: not measured by this live-source drill; managed backup timestamp and retention must be documented separately."
            echo "- Scope: staging only; database restored to ephemeral local PostgreSQL; Storage restored to a temporary private bucket and removed."
            echo "- No backup files or media objects are uploaded as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

