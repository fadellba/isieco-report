name: Render UML class diagrams

on:
  push:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "scripts/render-uml-class-diagrams.py"
      - "docs/uml/diagramme-classes.md"
      - ".github/workflows/render-uml-class-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-uml-class-diagrams
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Render overview and detailed domain PNGs
        run: python3 scripts/render-uml-class-diagrams.py

      - name: Commit generated PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uml/diagramme-classes-*.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit."
          else
            git commit -m "docs(uml): publish class diagram PNGs"
            git push origin HEAD:main
          fi
