name: Refresh Mobile lockfile

on:
  push:
    branches: [feat/frontend-reference-fidelity]
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/refresh-mobile-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Update frozen workspace lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/refresh-mobile-lockfile.yml
          git commit -m "chore(mobile): lock Expo DOM web runtime dependencies"
          git push
