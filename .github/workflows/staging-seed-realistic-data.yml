name: Staging Seed Realistic Data

on:
  workflow_dispatch:
    inputs:
      seed_realistic_data:
        description: "Select SEED_REALISTIC to populate rich, realistic data (users, real HD photos, Dakar geo-locations, files & interventions) in staging."
        required: true
        type: choice
        options:
          - NO
          - SEED_REALISTIC
        default: NO
      common_password:
        description: "Password for all created realistic accounts (default: IsiEco2026!Test)."
        required: false
        type: string
        default: "IsiEco2026!Test"

permissions:
  contents: read

concurrency:
  group: staging-seed-realistic-data
  cancel-in-progress: false

jobs:
  seed:
    name: Seed realistic data and real photos into staging
    if: github.ref == 'refs/heads/main' && inputs.seed_realistic_data == 'SEED_REALISTIC'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_URL: https://mlhbdautaxufubaybzyt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      DIRECT_URL: ${{ secrets.STAGING_PRISMA_URL }}
      STAGING_SUPABASE_CA_CERT: ${{ secrets.STAGING_SUPABASE_CA_CERT }}
      STAGING_COMMON_PASSWORD: ${{ inputs.common_password || secrets.STAGING_COMMON_PASSWORD || 'IsiEco2026!Test' }}
    steps:
      - name: Validate staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SECRET_KEY:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_SECRET_KEY"
            exit 1
          }
          test -n "${DIRECT_URL:-}" || {
            echo "Missing staging environment secret: STAGING_PRISMA_URL"
            exit 1
          }
          test -n "${STAGING_SUPABASE_CA_CERT:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_CA_CERT"
            exit 1
          }
          echo "Staging realistic seed credentials are configured. Secret values were not printed."

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate seed script syntax
        run: node --check apps/api/scripts/seed-staging-realistic-data.mjs

      - name: Seed realistic users, categories, reports, real images, and workflow interventions
        run: pnpm --filter @isieco/api seed:staging:realistic-data
