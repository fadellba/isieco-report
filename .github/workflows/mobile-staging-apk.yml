name: Mobile Staging APK

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mobile-staging-apk
  cancel-in-progress: false

jobs:
  build-android-preview:
    name: Initialize EAS and build staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN is missing or empty."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

      - name: Initialize or link the EAS project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli@latest init --force --non-interactive --json

      - name: Configure Expo preview environment with staging values
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . ./.env.staging.example
          set +a

          test -n "$EXPO_PUBLIC_API_BASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

          pnpm dlx eas-cli@latest env:set \
            --name EXPO_PUBLIC_API_BASE_URL \
            --value "$EXPO_PUBLIC_API_BASE_URL" \
            --environment preview \
            --visibility plaintext \
            --non-interactive

          pnpm dlx eas-cli@latest env:set \
            --name EXPO_PUBLIC_SUPABASE_URL \
            --value "$EXPO_PUBLIC_SUPABASE_URL" \
            --environment preview \
            --visibility plaintext \
            --non-interactive

          pnpm dlx eas-cli@latest env:set \
            --name EXPO_PUBLIC_SUPABASE_ANON_KEY \
            --value "$EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            --environment preview \
            --visibility plaintext \
            --non-interactive

      - name: Set the APK profile to use the EAS preview environment
        working-directory: apps/mobile
        run: |
          jq '.build["preview-apk"].environment = "preview"' eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" eas.json

      - name: Open PR with the generated EAS project configuration
        id: config-pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/eas-staging-bootstrap-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/eas.json

          if git diff --cached --quiet; then
            echo "No EAS configuration changes were generated."
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(mobile): link EAS staging project"
            git push --set-upstream origin "$branch"
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(mobile): link EAS staging project" \
              --body "## Summary
          - Link the mobile app to its EAS project.
          - Configure the preview APK profile to use EAS `preview` environment variables.
          - Keep the API and Supabase settings pointed at staging.

          Generated by the Mobile Staging APK workflow. No production services are changed.")"
            echo "url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "Configuration PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android staging APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli@latest build --platform android --profile preview-apk --non-interactive --wait
