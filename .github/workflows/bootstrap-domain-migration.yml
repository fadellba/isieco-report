name: Generate additive MLD migration

on:
  push:
    branches:
      - feat/phase-1-additive-migrations

permissions:
  contents: write

concurrency:
  group: generate-additive-mld-migration
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and commit the reviewed Prisma diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: isieco_report
          POSTGRES_USER: isieco
          POSTGRES_PASSWORD: isieco_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isieco -d isieco_report"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-shadow:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: isieco_shadow
          POSTGRES_USER: isieco
          POSTGRES_PASSWORD: isieco_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U isieco -d isieco_shadow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Generate additive SQL from the committed migration history
        env:
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          SHADOW_DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5433/isieco_shadow?schema=public
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --script \
            --output=/tmp/mld-v213-domain-migration.sql

          test -s /tmp/mld-v213-domain-migration.sql
          mkdir -p prisma/migrations/20261030230000_mld_v213_domain_models
          cp /tmp/mld-v213-domain-migration.sql prisma/migrations/20261030230000_mld_v213_domain_models/migration.sql

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261030230000_mld_v213_domain_models/migration.sql
          git commit -m "build(database): add MLD v2.13 domain tables"
          git push origin HEAD:feat/phase-1-additive-migrations
