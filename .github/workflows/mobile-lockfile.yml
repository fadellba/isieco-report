name: Mobile Lockfile Resolver

on:
  push:
    branches:
      - feat/phase-21-mobile-native-media
    paths:
      - apps/mobile/package.json

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve pnpm lockfile with pinned workspace toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Resolve lockfile without installing workspace packages
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit resolved lockfile to feature branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(mobile): resolve Expo SDK 57 native media dependencies"
          git push origin "HEAD:${BRANCH_NAME}"
