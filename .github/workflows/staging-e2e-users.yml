name: Staging E2E Test Users

on:
  workflow_dispatch:
    inputs:
      seed_staging_test_users:
        description: "Select CREATE to provision the eight isolated role accounts in staging."
        required: true
        type: choice
        options:
          - NO
          - CREATE
        default: NO

permissions:
  contents: read

concurrency:
  group: staging-e2e-test-users
  cancel-in-progress: false

jobs:
  seed:
    name: Provision isolated staging Auth users
    if: github.ref == 'refs/heads/main' && inputs.seed_staging_test_users == 'CREATE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_URL: https://mlhbdautaxufubaybzyt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      DIRECT_URL: ${{ secrets.STAGING_PRISMA_URL }}
      STAGING_E2E_PASSWORD_SEED: ${{ secrets.STAGING_E2E_PASSWORD_SEED }}
    steps:
      - name: Validate staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SECRET_KEY:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_SECRET_KEY"
            exit 1
          }
          test -n "${DIRECT_URL:-}" || {
            echo "Missing staging environment secret: STAGING_PRISMA_URL"
            exit 1
          }
          test -n "${STAGING_E2E_PASSWORD_SEED:-}" || {
            echo "Missing staging environment secret: STAGING_E2E_PASSWORD_SEED"
            exit 1
          }
          echo "Staging seed credentials are configured. Secret values were not printed."

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision and verify eight isolated test users
        run: pnpm --filter @isieco/api seed:staging:e2e-users
