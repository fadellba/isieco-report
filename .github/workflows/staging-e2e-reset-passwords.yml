name: Staging E2E Reset All Passwords

on:
  workflow_dispatch:
    inputs:
      reset_all_passwords:
        description: "Select RESET_ALL to set the temporary password for the eight isolated staging test accounts."
        required: true
        type: choice
        options:
          - NO
          - RESET_ALL
        default: NO

permissions:
  contents: read

concurrency:
  group: staging-e2e-reset-all-passwords
  cancel-in-progress: false

jobs:
  reset:
    name: Reset and verify all eight staging E2E passwords
    if: github.ref == 'refs/heads/main' && inputs.reset_all_passwords == 'RESET_ALL'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_E2E_SHARED_PASSWORD: ${{ secrets.STAGING_E2E_SHARED_PASSWORD }}
    steps:
      - name: Validate staging-only secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SECRET_KEY:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_SECRET_KEY"
            exit 1
          }
          test -n "${STAGING_SUPABASE_ANON_KEY:-}" || {
            echo "Missing staging environment secret: STAGING_SUPABASE_ANON_KEY"
            exit 1
          }
          test -n "${STAGING_E2E_SHARED_PASSWORD:-}" || {
            echo "Missing staging environment secret: STAGING_E2E_SHARED_PASSWORD"
            exit 1
          }
          echo "Required staging-only secrets are present; values were not printed."

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install API workspace dependencies
        run: pnpm install --filter @isieco/api... --frozen-lockfile

      - name: Validate reset script
        run: node --check apps/api/scripts/reset-staging-e2e-passwords.mjs

      - name: Reset and verify the eight allow-listed staging accounts
        run: pnpm --filter @isieco/api reset:staging:e2e-passwords
