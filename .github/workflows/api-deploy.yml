name: API Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: api-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API after successful CI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for successful CI on this commit
        env:
          GH_TOKEN: \${{ github.token }}
          GH_API_URL: \${{ github.api_url }}
          GH_REPOSITORY: \${{ github.repository }}
          TARGET_SHA: \${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GH_API_URL/repos/$GH_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=30")"

            run="$(jq -c --arg sha "$TARGET_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .name == "CI")] | sort_by(.created_at) | reverse | .[0] // empty' \
              <<< "$response")"

            if [ -n "$run" ]; then
              status="$(jq -r '.status' <<< "$run")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
              run_id="$(jq -r '.id' <<< "$run")"
              echo "CI run $run_id for $TARGET_SHA: $status"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Successful CI confirmed for the exact deployment commit."
                  exit 0
                fi
                echo "CI did not succeed; deployment is blocked."
                exit 1
              fi
            else
              echo "Waiting for CI run on $TARGET_SHA (attempt $attempt/40)."
            fi
            sleep 15
          done
          echo "No successful CI run found for the exact commit within the bounded wait."
          exit 1

      - name: Trigger Render production deployment
        id: deploy
        env:
          DEPLOY_HOOK_URL: \${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "\${DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; deployment was skipped."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Configure the Render production Deploy Hook as a repository or environment secret." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$DEPLOY_HOOK_URL" in
            https://*) ;;
            *) echo "The Render Deploy Hook must use HTTPS."; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 30 \
            --request POST "$DEPLOY_HOOK_URL" --output /dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Render accepted the production deployment request." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployed Web
        if: steps.deploy.outputs.deployed == 'true'
        env:
          SMOKE_URL: \${{ secrets.API_SMOKE_URL }}
        run: |
          if [ -z "\${SMOKE_URL:-}" ]; then
            echo "API_SMOKE_URL is not configured; smoke test was skipped."
            exit 0
          fi
          case "$SMOKE_URL" in
            https://*) ;;
            *) echo "API_SMOKE_URL must use HTTPS."; exit 1 ;;
          esac
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --location --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$SMOKE_URL" || true)"
            case "$status" in
              2*|3*) echo "API smoke test passed with HTTP $status."; exit 0 ;;
            esac
            echo "API not ready yet (HTTP \${status:-000}), attempt $attempt/24."
            sleep 10
          done
          echo "API smoke test did not become healthy within the bounded retry window."
          exit 1
