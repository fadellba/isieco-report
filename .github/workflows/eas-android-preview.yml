name: Android preview APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/eas-android-preview.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/eas-android-preview.yml"

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-android-preview:
    name: Build internal Android APK
    if: >-
      github.repository == 'fadellba/isieco-report' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/isieco-ux-ui-foundation'
        ) ||
        (
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether the Expo token is configured
        id: expo-auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned EAS CLI
        if: steps.expo-auth.outputs.available == 'true'
        run: npm install --global eas-cli@27.10.0

      - name: Verify Expo authentication
        if: steps.expo-auth.outputs.available == 'true'
        working-directory: apps/mobile
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK (no store submission)
        if: steps.expo-auth.outputs.available == 'true'
        working-directory: apps/mobile
        run: eas build --profile preview-apk --platform android --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Explain skipped native build
        if: steps.expo-auth.outputs.available != 'true'
        run: |
          echo "::notice title=Android APK build skipped::Add the EXPO_TOKEN repository Actions secret, then rerun this workflow to build the internal preview APK."
