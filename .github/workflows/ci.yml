name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: isieco_report
          POSTGRES_USER: isieco
          POSTGRES_PASSWORD: isieco_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isieco -d isieco_report"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-shadow:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: isieco_shadow
          POSTGRES_USER: isieco
          POSTGRES_PASSWORD: isieco_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U isieco -d isieco_shadow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Validate Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$EVENT_BASE"
            HEAD_SHA="$EVENT_HEAD"
          else
            BASE_SHA="$EVENT_BEFORE"
            HEAD_SHA="$PUSH_HEAD"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to validate."
            exit 0
          fi

          # GitHub merge commits use generated subjects that do not follow Conventional Commits.
          # Validate the authored commits, not the synthetic merge commit.
          git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commit-subjects.txt"
          node scripts/check-conventional-commits.mjs "$RUNNER_TEMP/commit-subjects.txt"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public

      - name: Apply committed migrations to a clean PostgreSQL database
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public

      - name: Verify migration history and generate additive SQL preview
        run: |
          pnpm exec prisma migrate status
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script --output=prisma/migration-preview.sql
        env:
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          SHADOW_DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5433/isieco_shadow?schema=public

      - name: Upload additive SQL migration preview
        if: always() && hashFiles('prisma/migration-preview.sql') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: prisma-additive-migration-preview
          path: prisma/migration-preview.sql
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate full SQL schema snapshot when the Prisma schema changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
        run: |
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- prisma/schema.prisma; then
            echo "Prisma schema unchanged; skipping SQL schema snapshot."
            exit 0
          fi
          pnpm exec prisma migrate diff --from-empty --to-schema=prisma/schema.prisma --script --output=prisma/schema-snapshot.sql
          test -s "prisma/schema-snapshot.sql"

      - name: Upload SQL migration preview
        if: always() && hashFiles('prisma/schema-snapshot.sql') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: prisma-schema-sql-snapshot
          path: prisma/schema-snapshot.sql
          if-no-files-found: ignore
          retention-days: 7

      - name: Build shared packages
        run: pnpm build:packages

      - name: Diagnose API TypeScript compilation
        run: pnpm --filter @isieco/api exec tsc --noEmit -p tsconfig.build.json

      - name: Compile the NestJS API
        run: pnpm --filter @isieco/api exec nest build --builder tsc

      - name: Generate OpenAPI specification
        run: pnpm --filter @isieco/api exec node --trace-uncaught dist/openapi/generate-openapi.js
        env:
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-public-key

      - name: Validate generated OpenAPI JSON
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; JSON.parse(readFileSync('docs/api/openapi.json', 'utf8')); console.log('OpenAPI JSON is valid.');"

      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v7.0.2
        with:
          name: isieco-openapi-specification
          path: docs/api/openapi.json
          if-no-files-found: error
          retention-days: 14

      - name: TypeScript checks
        run: pnpm typecheck

      - name: Run application tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report

      - name: Build Web, API and Mobile applications
        run: pnpm build
        env:
          DATABASE_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          DIRECT_URL: postgresql://isieco:isieco_dev_password@localhost:5432/isieco_report?schema=public
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-public-key
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key

