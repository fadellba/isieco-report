name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - chore/add-pnpm-lockfile

permissions:
  contents: write

concurrency:
  group: pnpm-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  generate-lockfile:
    name: Generate and commit pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Resolve workspace dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ ! -s pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml was not generated."
            exit 1
          fi

          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already tracked; nothing to bootstrap."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(deps): add pnpm workspace lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
